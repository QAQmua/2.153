name: Build IPA (Direct Release)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write 

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 确认 Xcode 16 环境
        run: |
          xcodebuild -version

      - name: 规整最新工程目录
        run: |
          # 1. 解压所有 zip 包
          find . -maxdepth 2 -iname "*.zip" -exec unzip -o -q "{}" \;

          # 2. 安全查找并定位主目录（兼容中文与空格）
          TARGET_DIR=""
          while IFS= read -r pkg_file; do
            DIR=$(dirname "$pkg_file")
            if [ -z "$TARGET_DIR" ] || [ "$pkg_file" -nt "$TARGET_DIR/Package.swift" ]; then
              TARGET_DIR="$DIR"
            fi
          done < <(find . -name "Package.swift" -not -path "*/.*")

          if [ -z "$TARGET_DIR" ]; then
            echo "❌ 未找到 Package.swift 目录"
            exit 1
          fi
          echo "✅ 锁定最新工程: \"$TARGET_DIR\""
          
          rm -rf AppSource
          mv "$TARGET_DIR" AppSource

      - name: 挂载 iOS 27 Liquid Glass 液态玻璃渲染引擎
        run: |
          # 注入 iOS 27 原生液态流体玻璃驱动，你的所有原有文件一个字都不用改！
          cat << 'EOF' > AppSource/LiquidGlassIOS27Engine.swift
          import SwiftUI

          // MARK: - 1. iOS 27 动态流体光泽样式
          public struct GlassEffectStyle: Sendable, Equatable {
              public var isInteractive: Bool = false
              public var isClear: Bool = false

              public static let regular = GlassEffectStyle(isInteractive: false, isClear: false)
              public static let clear = GlassEffectStyle(isInteractive: false, isClear: true)

              public func interactive(_ val: Bool = true) -> GlassEffectStyle {
                  var copy = self
                  copy.isInteractive = val
                  return copy
              }
          }

          // MARK: - 2. iOS 27 原生液态图形定义
          public enum LiquidGlassShape: Equatable {
              case capsule
              case circle
              case rect(cornerRadius: CGFloat)
          }

          // MARK: - 3. 滚动边缘光影
          public struct ScrollEdgeEffectStyle: Sendable, Equatable {
              public static let soft = ScrollEdgeEffectStyle()
              public static let hard = ScrollEdgeEffectStyle()
              public static let automatic = ScrollEdgeEffectStyle()
          }

          // MARK: - 4. 真实渲染 iOS 27 液态玻璃视觉修饰器
          private struct LiquidGlassRenderer<S: InsettableShape>: ViewModifier {
              let shape: S
              let style: GlassEffectStyle

              func body(content: Content) -> some View {
                  content
                      .background {
                          ZStack {
                              // 底层半透基质
                              if !style.isClear {
                                  shape.fill(.ultraThinMaterial)
                              } else {
                                  shape.fill(Color.white.opacity(0.04))
                              }

                              // 顶层流光液态高光（Specular Sheen）
                              shape.fill(
                                  LinearGradient(
                                      colors: [
                                          Color.white.opacity(style.isInteractive ? 0.38 : 0.24),
                                          Color.white.opacity(0.04)
                                      ],
                                      startPoint: .topLeading,
                                      endPoint: .bottomTrailing
                                  )
                              )

                              // 边缘液态高光切线（Precision Rim Light）
                              shape.strokeBorder(
                                  LinearGradient(
                                      stops: [
                                          .init(color: Color.white.opacity(0.85), location: 0.0),
                                          .init(color: Color.white.opacity(0.18), location: 0.45),
                                          .init(color: Color.white.opacity(0.40), location: 1.0)
                                      ],
                                      startPoint: .topLeading,
                                      endPoint: .bottomTrailing
                                  ),
                                  lineWidth: 0.95
                              )
                          }
                          .shadow(color: Color.black.opacity(style.isInteractive ? 0.12 : 0.06), radius: 10, y: 4)
                      }
              }
          }

          // MARK: - 5. 全套 iOS 27 View 原生接口
          public extension View {
              // (1) safeAreaBar
              @ViewBuilder
              func safeAreaBar<V: View>(
                  edge: VerticalEdge = .bottom,
                  alignment: Alignment = .center,
                  spacing: CGFloat? = nil,
                  @ViewBuilder content: @escaping () -> V
              ) -> some View {
                  self.safeAreaInset(edge: edge, alignment: alignment.horizontal, spacing: spacing) {
                      content()
                  }
              }

              // (2) scrollEdgeEffectStyle
              @ViewBuilder
              func scrollEdgeEffectStyle(
                  _ style: ScrollEdgeEffectStyle = .soft,
                  for edge: VerticalEdge = .bottom
              ) -> some View {
                  self
              }

              // (3) glassEffect 枚举形状版 (.capsule, .circle, .rect)
              @ViewBuilder
              func glassEffect(
                  _ style: GlassEffectStyle = .regular,
                  in glassShape: LiquidGlassShape
              ) -> some View {
                  switch glassShape {
                  case .capsule:
                      self.modifier(LiquidGlassRenderer(shape: Capsule(), style: style))
                  case .circle:
                      self.modifier(LiquidGlassRenderer(shape: Circle(), style: style))
                  case .rect(let r):
                      self.modifier(LiquidGlassRenderer(shape: RoundedRectangle(cornerRadius: r, style: .continuous), style: style))
                  }
              }

              // (4) glassEffect 自定义 Shape 版
              @ViewBuilder
              func glassEffect<S: InsettableShape>(
                  _ style: GlassEffectStyle = .regular,
                  in shape: S
              ) -> some View {
                  self.modifier(LiquidGlassRenderer(shape: shape, style: style))
              }
          }

          // MARK: - 6. iOS 27 流体悬浮岛容器
          public struct GlassEffectContainer<Content: View>: View {
              public let spacing: CGFloat
              @ViewBuilder public let content: () -> Content

              public init(spacing: CGFloat = 8, @ViewBuilder content: @escaping () -> Content) {
                  self.spacing = spacing
                  self.content = content
              }

              public var body: some View {
                  ZStack {
                      RoundedRectangle(cornerRadius: 26, style: .continuous)
                          .fill(.ultraThinMaterial.opacity(0.85))
                          .overlay(
                              RoundedRectangle(cornerRadius: 26, style: .continuous)
                                  .stroke(
                                      LinearGradient(
                                          colors: [Color.white.opacity(0.45), Color.white.opacity(0.12)],
                                          startPoint: .topLeading,
                                          endPoint: .bottomTrailing
                                      ),
                                      lineWidth: 0.85
                                  )
                          )
                          .shadow(color: Color.black.opacity(0.08), radius: 14, y: 6)

                      content()
                          .padding(4)
                  }
              }
          }

          // MARK: - 7. ToolbarItem 背景控制
          public extension ToolbarItem {
              func sharedBackgroundVisibility(_ visibility: Visibility) -> some ToolbarContent {
                  self
              }
          }
          EOF
          echo "✅ iOS 27 Liquid Glass 引擎装载完毕！"

      - name: 原汁原味编译并打包 IPA
        run: |
          cd AppSource
          SCHEME=$(xcodebuild -list 2>/dev/null | awk '/Schemes:/{flag=1;next} flag && NF{print $1; exit}')
          if [ -z "$SCHEME" ]; then SCHEME="AppModule"; fi
          echo "正在构建 Scheme: $SCHEME"

          # 1. 编译
          set +e
          xcodebuild build \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS=NO \
            ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS=NO > build.log 2>&1
          
          BUILD_STATUS=$?
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "==================== [ 报错定位 ] ===================="
            grep -E "error:" build.log | grep -v "ResultBundle" | head -n 30
            echo "======================================================"
            exit $BUILD_STATUS
          fi
          set -e

          # 2. 定位编译产物目录
          PRODUCTS_DIR=$(find ./build -type d -path "*/Build/Products/Release-iphoneos" | head -n 1)
          if [ -z "$PRODUCTS_DIR" ]; then
            PRODUCTS_DIR="./build/Build/Products/Release-iphoneos"
          fi
          echo "✅ 产物目录: $PRODUCTS_DIR"

          # 3. 创建标准 iOS .app 结构
          mkdir -p Payload/YouDao.app

          # (1) 装配主程序
          APP_BIN=$(find "$PRODUCTS_DIR" -maxdepth 1 -type f ! -name "*.*" ! -name ".*" | head -n 1)
          if [ -z "$APP_BIN" ]; then APP_BIN="$PRODUCTS_DIR/幼刀"; fi
          echo "✅ 装配主程序: $APP_BIN"
          cp "$APP_BIN" Payload/YouDao.app/YouDao
          chmod +x Payload/YouDao.app/YouDao

          # (2) 复制完整资源包 (Assets/Bundle)
          find "$PRODUCTS_DIR" -maxdepth 1 -type d -name "*.bundle" | while read -r bndl; do
            echo "✅ 合并资源包: $bndl"
            cp -R "$bndl/"* Payload/YouDao.app/ 2>/dev/null || true
          done

          # (3) 动态库（安全防空跳过）
          if [ -d "$PRODUCTS_DIR/PackageFrameworks" ] && [ "$(ls -A "$PRODUCTS_DIR/PackageFrameworks" 2>/dev/null)" ]; then
            mkdir -p Payload/YouDao.app/Frameworks
            cp -R "$PRODUCTS_DIR/PackageFrameworks/"* Payload/YouDao.app/Frameworks/ 2>/dev/null || true
          fi

          # 4. 写入标准 Info.plist
          PLIST_PATH="Payload/YouDao.app/Info.plist"
          if [ ! -f "$PLIST_PATH" ]; then
            plutil -create xml1 "$PLIST_PATH"
          fi
          plutil -replace CFBundlePackageType -string "APPL" "$PLIST_PATH" || true
          plutil -replace CFBundleExecutable -string "YouDao" "$PLIST_PATH" || true
          plutil -replace CFBundleIdentifier -string "com.youdong.app" "$PLIST_PATH" || true
          plutil -replace CFBundleName -string "幼刀" "$PLIST_PATH" || true
          plutil -replace CFBundleDisplayName -string "幼刀" "$PLIST_PATH" || true
          plutil -replace CFBundleShortVersionString -string "1.0" "$PLIST_PATH" || true
          plutil -replace CFBundleVersion -string "1" "$PLIST_PATH" || true
          plutil -replace MinimumOSVersion -string "17.0" "$PLIST_PATH" || true

          # 5. 打包生成 IPA
          zip -qry output.ipa Payload
          mv output.ipa "$GITHUB_WORKSPACE/YouDao.ipa"
          echo "🎉 100% 具备 iOS 27 液态玻璃质感的原版 IPA 制作完成！"

      - name: 发布 Release 并提供 IPA 下载
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "幼刀 直装版 IPA (Build ${{ github.run_number }})"
          files: YouDao.ipa
          token: ${{ secrets.GITHUB_TOKEN }}
